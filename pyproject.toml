[project]
name = "commonspulse"
version = "0.1.0"
description = "Evidence-based portfolio monitoring agent for public goods grants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
]

[project.scripts]
commonspulse = "commonspulse.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true
